<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NITM Strategy</title>
<style>
  /* nav.js owns the neutral palette (--bg/--panel/--surface/--border/--text/...). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, -apple-system, sans-serif; min-height: 100vh; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 8px; }
  .subtitle { color: #64748b; font-size: 14px; margin-bottom: 28px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; font-size: 14px; line-height: 1.6; }
  .ok { color: #059669; font-weight: 600; }
  .err { color: #b42318; font-weight: 600; }
  code { background: var(--surface); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Strategic Plan</h1>
  <div class="subtitle">Plan status, planning and train/hire gaps for the leadership team. Being built.</div>
  <div class="panel" id="who">Checking who you are…</div>
</div>
<script>
(async () => {
  const el = document.getElementById('who');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  try {
    const res = await fetch('/strategy/api/whoami', { headers: { Accept: 'application/json' } });
    const data = await res.json().catch(() => ({ error: `Unexpected response (${res.status})` }));
    if (res.ok) {
      el.innerHTML = `<span class="ok">✓ You're in.</span> Signed in as <b>${esc(data.name)}</b> (${esc(data.email)}), role <b>${esc(data.role)}</b>.`;
    } else {
      el.innerHTML = `<span class="err">Not let in (${res.status}).</span> ${esc(data.error)} <br><code>${esc(data.reason)}</code>`;
    }
  } catch (e) {
    el.innerHTML = `<span class="err">Couldn't reach Ops Hub.</span> ${esc(e.message)}`;
  }
})();
</script>
<script defer src="/shared/nav.js"></script>
</body>
</html>
